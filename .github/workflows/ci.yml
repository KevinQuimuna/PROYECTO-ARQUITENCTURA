name: CI LogiFlow Fase 1

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
#prueba de fuego
jobs:
  build-analyze:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp verify

      - name: SonarCloud
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.projectKey=${SONAR_PROJECT_KEY}

      - name: Resumen JaCoCo (cobertura aproximada)
        if: always()
        run: |
          python3 << 'PY'
          import glob, xml.etree.ElementTree as ET, os
          parts = []
          for path in sorted(glob.glob('*/target/site/jacoco/jacoco.xml')):
              try:
                  root = ET.parse(path).getroot()
                  for c in root.findall('.//counter[@type="INSTRUCTION"]'):
                      m = int(c.get('missed'))
                      cov = int(c.get('covered'))
                      tot = m + cov
                      pct = 100.0 * cov / tot if tot else 0.0
                      mod = path.split('/')[0]
                      parts.append(f"{mod}:{pct:.1f}%")
                      break
              except Exception:
                  pass
          summary = ",".join(parts) if parts else "n/d"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"COVERAGE_SUMMARY={summary}\n")
          PY

      - name: Notificar Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram omitido: defina TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID en los secretos del repositorio."
            exit 0
          fi
          SONAR_TXT="SonarCloud no ejecutado (faltan secretos SONAR_TOKEN, SONAR_ORGANIZATION o SONAR_PROJECT_KEY)."
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            SONAR_TXT="SonarCloud ejecutado. Issues y duplicaciones: ver panel del proyecto en sonarcloud.io (Quality Gate)."
          fi
          COV="${COVERAGE_SUMMARY:-n/d}"
          MSG="LogiFlow CI | repo=${REPO} | rama=${REF} | maven=${STATUS} | cobertura_instr=${COV} | ${SONAR_TXT} | commit=${SHA:0:7} | ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
