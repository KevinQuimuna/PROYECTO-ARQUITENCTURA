server:
  port: 8085

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/logiflow_pedidos}
    username: ${SPRING_DATASOURCE_USERNAME:logiflow_pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:logiflow}
    password: ${RABBITMQ_PASS:logiflow}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
