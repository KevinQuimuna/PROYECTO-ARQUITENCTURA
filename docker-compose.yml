# Infraestructura LogiFlow — PostgreSQL + RabbitMQ
# Arranque: docker compose up -d
# PostgreSQL en host: 5433 | RabbitMQ AMQP: 5672 | Management UI: http://localhost:15672
services:
  logiflow-postgres:
    image: postgres:16-alpine
    container_name: logiflow-postgres
    environment:
      POSTGRES_USER: logiflow_flota
      POSTGRES_PASSWORD: flota_secret
      POSTGRES_DB: logiflow_flota
    ports:
      - "5433:5432"
    volumes:
      - logiflow_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres/docker-init:/docker-entrypoint-initdb.d:ro

  logiflow-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: logiflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: logiflow
      RABBITMQ_DEFAULT_PASS: logiflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - logiflow_rabbitmq_data:/var/lib/rabbitmq

volumes:
  logiflow_pgdata:
  logiflow_rabbitmq_data:
